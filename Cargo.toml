[workspace]
members = [
  "crates/pocket-ic-harness",
  "crates/pocket-ic-harness-macro",
  "integration-tests/pocket-ic-tests",
  "integration-tests/test-canister",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
authors = ["Christian Visintin <christian.visintin@veeso.dev>"]
categories = ["development-tools::testing", "wasm"]
edition = "2024"
keywords = ["ic", "pocket-ic", "testing", "canister", "internet-computer"]
license = "MIT"
repository = "https://github.com/veeso/pocket-ic-harness"
rust-version = "1.88.0"

[workspace.dependencies]
anyhow = "1"
candid = "0.10"
flate2 = "1"
ic-agent = "0.47"
ic-cdk = "0.20"
ic-cdk-macros = "0.20"
pocket-ic = "13"
pocket-ic-harness = { path = "crates/pocket-ic-harness", version = "0.2" }
pocket-ic-harness-macro = { path = "crates/pocket-ic-harness-macro", version = "0.2" }
proc-macro2 = "1"
quote = "1"
reqwest = "0.13"
serde = "1"
syn = "2"
test-canister = { path = "integration-tests/test-canister" }
tokio = "1"
url = "2"
